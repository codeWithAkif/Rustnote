[package]
name = "adim"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Performance"] }

[[bin]]
name = "adim"
path = "src/main.rs"
required-features = ["ui"]

[profile.release]
opt-level = "s"
lto = true

[features]
ui = ["dep:dioxus"]
desktop = ["ui", "dioxus/desktop"]
mobile = ["ui", "dioxus/mobile"]
web = ["ui", "dioxus/web"]
