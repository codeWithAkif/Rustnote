name: Web (PWA) yayınla

on:
  push:
    branches: [main, ccr-46c1736b-8d8bqz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli --no-confirm --locked
      - run: cargo test --lib --release
      - run: dx bundle --platform web --release --features web
      - name: gh-pages dalına yayınla
        run: |
          set -eux
          SRC=target/dx/adim/release/web/public
          test -f "$SRC/index.html"
          # Önbellekten kalan eski klasörlerden etkilenmemek için temiz bir dizine kopyala
          SITE=$(mktemp -d)
          cp -a "$SRC/." "$SITE/"
          rm -rf "$SITE/.git"
          touch "$SITE/.nojekyll"
          cp "$SITE/index.html" "$SITE/404.html"
          cd "$SITE"
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
