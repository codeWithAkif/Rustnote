name: Android APK

on:
  push:
    branches: [main, ccr-46c1736b-8d8bqz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Hazır Android SDK/NDK'yı kullan
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/ndk" || true
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK" && test -d "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli --no-confirm --locked
      - run: dx build --platform android --target aarch64-linux-android --features mobile
      - name: APK'yı bul
        run: |
          APK=$(find target/dx -name '*.apk' | head -1)
          echo "APK=$APK"; test -n "$APK"
          cp "$APK" rustnote.apk
      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: RustNote APK (son sürüm)
          prerelease: true
          files: rustnote.apk
          target_commitish: ${{ github.sha }}
